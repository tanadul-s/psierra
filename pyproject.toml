[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "psierra"
version = "26.09"
dependencies = [
    # Scientific
    "numpy",
    "scipy",
    "cupy-cuda12x",
    "matplotlib",
    "pandas",

    # Mesh
    "meshio",
    "pyvista",
    "embreex",
    "trimesh",
    "pytetwild",

    # Miscellaneous
    "pyyaml",
    "rich",
]
requires-python = ">= 3.12"
authors = [
    { name = "Tanadul Somboonwong", email = "tanadul.sob@student.mahidol.ac.th" },
]
maintainers = [
    { name = "Tanadul Somboonwong", email = "tanadul.sob@student.mahidol.ac.th" },
]
description = "A Python package for FEM structural analysis"
readme = "README.md"

[project.optional-dependencies]
dev = ["pytest", "pytest-xdist"]

[tool.pytest.ini_options]
filterwarnings = [
    "ignore::DeprecationWarning:vtkmodules.*",
]
